# Step 5a – Argo CD deploys the sample app into its own namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ramagopr/eks-lab.git
    targetRevision: main
    path: k8s/podinfo
  destination:
    server: https://kubernetes.default.svc
    namespace: podinfo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true   # Argo CD creates the "podinfo" namespace if missing
