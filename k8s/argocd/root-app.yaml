# Step 4 – the "app of apps".
# Applied ONCE by hand (bootstrap). After that, Argo CD watches k8s/apps/ and creates
# whatever Applications it finds there. To add something to the cluster: add a file to k8s/apps/ and push.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ramagopr/eks-lab.git
    targetRevision: main
    path: k8s/apps
  destination:
    server: https://kubernetes.default.svc   # "this cluster" – the one Argo CD runs in
    namespace: argocd
  syncPolicy:
    automated:
      prune: true      # delete things that are removed from Git
      selfHeal: true   # undo manual changes made with kubectl
