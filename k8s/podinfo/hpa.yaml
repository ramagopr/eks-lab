# HPA step – scale podinfo between 2 and 10 pods to keep average CPU around 60% of the request.
# Request is 100m, so HPA adds pods when pods average more than ~60m CPU.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: podinfo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: podinfo
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0      # react to load immediately
    scaleDown:
      stabilizationWindowSeconds: 120    # wait 2 min of low load before removing pods (default is 5 min)
